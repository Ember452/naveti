name: deps audit

# Weekly, not daily: nothing in this repository moves dependencies on its own -
# there is no renovate bot, and `minimumReleaseAge` holds back freshly published
# versions - so a daily run produces no new information and trains the one reader
# who matters to mute it. Revisit to daily when either happens:
#   1. an installable artifact ships (the P3 gate in docs/plan/master-plan.md); or
#   2. `platform/host` transport accepts a connection from outside 127.0.0.1.
# Until then the attack surface this scan guards is an outbound HTTPS client held
# by a local process with no users.
on:
  schedule:
    - cron: '37 7 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same approach ci.yml already proves out: install pnpm from npm before
      # setup-node so the cache step can shell out to it. No new action reference is
      # introduced here - a pin nobody has run is not a pin, it is a guess.
      - name: Install pnpm
        run: npm install --global pnpm@11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      # The lockfile decides versions, so no lifecycle scripts beyond the ones
      # pnpm-workspace.yaml allows. This is the same posture as CI.
      - name: Install production dependencies
        run: pnpm install --frozen-lockfile --prod

      - name: Audit production vulnerabilities
        run: node scripts/deps-audit.mjs

      # Upstream's `npm audit signatures` step is gone on purpose. pnpm exposes no
      # equivalent subcommand; what remains is that `--frozen-lockfile` refuses any
      # package whose resolved integrity differs from the lockfile, which is checked
      # on every install and on every CI run, not only here.
