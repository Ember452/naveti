name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm is installed before setup-node so its cache step can shell out to it.
      # The version matches packageManager in package.json.
      - name: Install pnpm
        run: npm install --global pnpm@11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Check
        run: pnpm run check

  # Tests are split across parallel jobs so the slowest suites do not run back to back.
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: durable
          - name: other
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        run: npm install --global pnpm@11.13.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Test
        env:
          SUITE: ${{ matrix.name }}
        run: |
          if [ "$SUITE" != other ]; then
            # The heap-measuring tests sit just above the default 5s budget.
            pnpm --filter "@naveti/$SUITE" run test -- --testTimeout=60000
            exit 0
          fi
          # Every other workspace, so new packages are tested without editing this workflow.
          for dir in packages/kernel/*/; do
            repo="${dir%/}"
            package="${repo##*/}"
            if [ "$package" = "durable" ]; then continue; fi
            if [ "$package" = "chord" ]; then
              # One test spies the global setTimeout, which is unsafe while files share a process.
              pnpm --filter "@naveti/$package" run test -- --no-file-parallelism
            else
              pnpm --filter "@naveti/$package" run test
            fi
          done
          pnpm run test:scripts
