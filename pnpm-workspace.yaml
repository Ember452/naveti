packages:
  - packages/kernel/*

# pnpm does not run dependency build scripts unless they are allowed here, and it
# errors when one is skipped. Decisions:
#   canvas     - denied. It needs a C++ toolchain (node-gyp fails on this Windows
#                host) and nothing under packages/kernel imports it. The previous
#                npm install never built it either (`--ignore-scripts`).
#   esbuild / workerd / protobufjs / @google/genai - allowed. They install platform
#                binaries or run postinstall steps that `npm install` used to run.
# Adding another entry needs a deliberate decision.
allowBuilds:
  "@google/genai": true
  canvas: false
  esbuild: true
  protobufjs: true
  workerd: true

# Same intent as the removed npm `min-release-age`: do not resolve versions
# published moments ago.
minimumReleaseAge: 2

# Patched transitive versions, forced only inside the two SDK subtrees.
# `pnpm audit --prod` reported 5 high / 4 moderate advisories, all reachable through
# openai and @anthropic-ai/sdk, and nobody declares zod or undici directly — they
# arrive as auto-installed peer dependencies. The patched versions sit inside the
# ranges those SDKs declare (`undici >=5 <9`, `zod ^3.25 || ^4`), so this is a real
# fix, not a suppression: no range is violated and no advisory is excused.
# Scope is per-parent on purpose: a global `zod: ^4` would force every package.
overrides:
  openai>undici: ^7.30.1
  openai>zod: ^4.6.6
  "@anthropic-ai/sdk>zod": ^4.6.6