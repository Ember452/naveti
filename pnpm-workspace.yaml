packages:
  - packages/kernel/*

# pnpm does not run dependency build scripts unless they are allowed here, and it
# errors when one is skipped. Decisions:
#   canvas     - denied. It needs a C++ toolchain (node-gyp fails on this Windows
#                host) and nothing under packages/kernel imports it. The previous
#                npm install never built it either (`--ignore-scripts`).
#   esbuild / workerd / protobufjs / @google/genai - allowed. They install platform
#                binaries or run postinstall steps that `npm install` used to run.
# Adding another entry needs a deliberate decision.
allowBuilds:
  "@google/genai": true
  canvas: false
  esbuild: true
  protobufjs: true
  workerd: true

# Same intent as the removed npm `min-release-age`: do not resolve versions
# published moments ago.
minimumReleaseAge: 2